apply plugin: 'com.android.application'

android {
    namespace 'com.steinwurf.adbjoinwifi'
    compileSdk 34

    defaultConfig {
        applicationId "com.steinwurf.adbjoinwifi"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 2
        versionName "1.1.0-android10"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Kotlin 1.8+ merged jdk7/jdk8 into kotlin-stdlib; drop the legacy shim artifacts
// (pulled transitively by androidx) to avoid duplicate-class conflicts.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
}
